name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Self-hosted runner on nova (free minutes, 16 cores vs 4 — the release
    # builds and benchmark suites are CPU-bound). Runner: nova-renegade-1,
    # isolated RUSTUP_HOME/CARGO_HOME per-runner; same setup as
    # sanity/mediator PR #580. The benchmark tests assert accuracy (RMSE),
    # not wall-clock time, so shared-machine load can't flake them.
    runs-on: [self-hosted, nova]
    steps:
      - uses: actions/checkout@v4

      # Declare rustfmt/clippy explicitly: dtolnay@stable installs a MINIMAL
      # profile, which worked on GitHub-hosted images only because they
      # preinstall a full toolchain. On the self-hosted runner the components
      # must be requested (first run failed on `cargo fmt` without this).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --release

      - name: Run benchmark tests
        run: cargo test --release --test benchmarks -- --nocapture

      - name: Run diverse dataset tests
        run: cargo test --release --test diverse_datasets -- --nocapture
